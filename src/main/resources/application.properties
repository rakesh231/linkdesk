spring.application.name=linkdesk
server.address=127.0.0.1
server.port=${PORT:8092}
app.public-origin=${PUBLIC_ORIGIN:http://localhost:${server.port}}
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/linkdesk;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=5000}
spring.datasource.username=sa
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=8
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=16KB
logging.level.com.rakesh.linkdesk=${APP_LOG_LEVEL:DEBUG}
